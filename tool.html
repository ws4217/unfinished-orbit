<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script type="module" crossorigin src="./assets/tool-gdT0jSHI.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/line-DVDxDqQ9.js">
    <link rel="stylesheet" crossorigin href="./assets/line-CcZ4Dto5.css">
  </head>
  <body class="tool-page">
    <main class="tool-panel">
      <p class="eyebrow" id="stage"></p>
      <h1 id="title"></h1>
      <div class="calibration-mark" aria-hidden="true"></div>
      <p id="status" role="status" hidden></p>
      <form id="token-form">
        <label id="token-label" for="token"></label>
        <input id="token" name="token" type="text" autocomplete="off" spellcheck="false" />
        <button id="submit" type="submit"></button>
      </form>
      <article id="letter" hidden>
        <h2 id="letter-title"></h2>
        <p id="greeting"></p>
        <p id="letter-body"></p>
        <p id="signature"></p>
      </article>
    </main>
  </body>
</html>
